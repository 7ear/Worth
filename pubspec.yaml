name: worth

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  syncfusion_flutter_charts: ^31.1.19
  provider: ^6.1.5
  get_storage: ^2.1.1
  get: ^4.7.2
  google_fonts: 6.3.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#0E0E0E"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/worth_icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/worth_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/worth_icon.png